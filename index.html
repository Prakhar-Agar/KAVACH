    <script>
      // Safeguard for browser extension interceptors attempting to set window.fetch
      (function() {
        try {
          var _f = window.fetch;
          Object.defineProperty(window, 'fetch', {
            get: function() { return _f; },
            set: function(v) { _f = v; },
            configurable: true,
            enumerable: true
          });
        } catch (_) {}
      })();
    </script>
